<header class="topbar">

    <div class="d-flex align-items-center gap-3">

        <button class="top-icon d-lg-none" type="button" aria-label="Abrir menú" aria-controls="sidebar"
            [attr.aria-expanded]="menuAbierto" (click)="alternarMenu()">

            <i class="bi bi-list fs-4"></i>
        </button>

        <div class="d-none d-sm-block">
            <div class="fw-bold" style="color:#193a65">
                Panel administrativo
            </div>

            <div class="eyebrow">
                Sistema de facturación y pagos
            </div>
        </div>

        <div class="d-sm-none fw-bold">
            SEITELCOM
        </div>

    </div>

    <div class="d-flex align-items-center gap-2 gap-sm-3">

        <button class="top-icon" type="button" aria-label="Buscar">
            <i class="bi bi-search"></i>
        </button>

        <button class="top-icon position-relative" type="button" aria-label="Notificaciones">

            <i class="bi bi-bell"></i>

            <span class="position-absolute top-0 start-100 translate-middle
               p-1 bg-danger border border-light rounded-circle">
            </span>

        </button>

        <div class="vr mx-1 d-none d-sm-block" style="height:32px;color:#dce5f1">
        </div>

        <div class="avatar">AD</div>

        <div class="d-none d-md-block">
            <div class="fw-bold small">
                Administrador
            </div>

            <div class="text-secondary" style="font-size:.73rem">
                Cuenta principal
            </div>
        </div>

    </div>

</header>
