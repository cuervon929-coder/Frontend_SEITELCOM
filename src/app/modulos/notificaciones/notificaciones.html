<section class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
    <div><h2 class="fw-bold mb-1">Notificaciones</h2><p class="text-muted mb-0">Mensajes y avisos enviados a los clientes</p></div>
    <button class="btn btn-outline-primary" (click)="cargar()" [disabled]="cargando"><i class="bi bi-arrow-clockwise me-2"></i>Actualizar</button>
  </div>
  <div class="card border-0 shadow-sm"><div class="card-body">
    <div class="d-flex justify-content-between flex-wrap gap-3 mb-3"><h5 class="mb-0">Registros: {{ registros.length }}</h5>
      <input class="form-control" style="max-width:320px" placeholder="Buscar..." [(ngModel)]="busqueda" aria-label="Buscar registros" /></div>
    <div *ngIf="cargando" class="text-muted">Cargando...</div>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    <div class="table-responsive" *ngIf="!cargando && !error"><table class="table table-hover align-middle">
      <thead class="table-light"><tr><th>ID</th><th>Cliente</th><th>Mensaje</th><th>Tipo</th><th>Fecha</th><th>Estado</th></tr></thead>
      <tbody><tr *ngFor="let r of filtrados"><td>{{ r.id_notificacion }}</td>
<td>{{ r.cliente }}</td>
<td>{{ r.mensaje }}</td>
<td>{{ r.tipo }}</td>
<td>{{ r.fecha_envio }}</td>
<td>{{ r.estado }}</td></tr>
        <tr *ngIf="filtrados.length === 0"><td colspan="6" class="text-center text-muted py-4">No hay registros para mostrar.</td></tr>
      </tbody></table></div>
  </div></div>
</section>
